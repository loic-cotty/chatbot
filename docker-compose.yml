services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./symfony:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php bin/console messenger:consume async -vv
    volumes:
      - ./symfony:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./symfony:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"

  redis:
    image: redis:7

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  adminer:
    image: adminer
    ports:
      - "8081:8080"